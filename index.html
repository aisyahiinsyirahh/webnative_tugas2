<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h3 align="center"><em>Tabel Profile mahasiswa</em></h3>
    <table border="1" cellpadding="10" cellspacing="0" align="center">

        <th colspan="5"><em>Profile Mahasiswa</em></th>
      </tr>
      <tr>
        <td rowspan="3"><img src="https://i.pinimg.com/564x/1e/7c/6f/1e7c6f5d8a2b9b4e5f8e4f5d8a2b9b4e.jpg" width="150" height="200" /></td>
        <td colspan="2">Nama</td>
        <td>:</td>
        <td>John Doe</td>
      </tr>
      <tr>
        <td colspan="2">NIM</td>
        <td>:</td>
        <td>123456789</td>
      </tr>
      <tr>
        <td colspan="2">Jurusan</td>
        <td>:</td>
        <td>Teknik Informatika</td>
      </tr>

        <td colspan="5">
          <table border="4" cellpadding="5" cellspacing="0" width="100%">
            <tr>
              <th>Semester</th>
              <th>IPK</th>
            </tr>

              <td align="center">1(Satu)</td>
              <td align="center">3.50</td>
            </tr>
            <tr>
              <td align="center">2(Dua)</td>
              <td align="center">3.75</td>
            </tr>
          </table>
        </td>
      </tr>

  </body>
